name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install
      - run: npm run typecheck

  # This package vendors byte-identical copies of the standalone Android and iOS
  # SDK sources. Without this gate a fix landing upstream never reaches React
  # Native users, and nothing fails to say so — the copies just quietly go stale.
  native-drift:
    name: Vendored native sources match upstream
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # No `npm install`: the checker deliberately uses only git and Node's
      # standard library, so drift is still detectable if the dependency tree
      # is broken.
      - name: Check vendored native sources
        run: npm run sync:native:check

  publish:
    needs: [build, native-drift]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publishing

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'  # trusted publishing requires Node 22.14.0+
          registry-url: https://registry.npmjs.org/

      - run: npm install

      - name: Build package
        run: npm run prepack

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --access public
        # No NODE_AUTH_TOKEN — npm CLI auto-detects OIDC from id-token and exchanges it
